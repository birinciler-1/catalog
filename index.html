<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c25e27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الكتالوج">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>كتالوج المندوب</title>
</head>
<body>

<header class="top">
  <div class="searchrow">
    <label class="search">
      <span data-icon="search"></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ابحث: ترمس، 01010، بيرينجلر…">
      <button id="clear" type="button" aria-label="مسح" hidden data-icon="close"></button>
    </label>
    <button class="icon-btn" id="btnPdf" type="button" aria-label="تصدير PDF" data-icon="pdf"></button>
    <button class="icon-btn" id="btnSettings" type="button" aria-label="الإعدادات" data-icon="sliders"></button>
  </div>
  <div class="cobar" id="cobar" hidden>
    <button type="button" id="coBack"><span data-icon="chevR"></span><span>الشركات</span></button>
    <b id="coName"></b>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div class="meta" id="meta">
    <span id="count"></span>
    <select id="sort" aria-label="الترتيب">
      <option value="file">الترتيب الأصلي</option>
      <option value="code">حسب الكود</option>
      <option value="priceAsc">الأرخص أولاً</option>
      <option value="priceDesc">الأغلى أولاً</option>
      <option value="company">حسب الشركة</option>
      <option value="name">حسب الاسم</option>
    </select>
    <label class="mini-switch"><input type="checkbox" id="inStock"><span>المتوفر فقط</span></label>
  </div>
</header>

<main>
  <div id="coGrid" class="cogrid" hidden></div>
  <div id="grid" class="grid"></div>
  <div id="sentinel"></div>
  <div id="empty" class="empty" hidden></div>
</main>

<!-- تفاصيل المنتج -->
<div id="detail" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="panel detail">
    <button class="x" data-close type="button" aria-label="إغلاق" data-icon="close"></button>
    <div class="dimg" id="dSwipe">
      <div id="dMedia" class="dmedia"></div>
      <button class="nav prev" id="dPrev" type="button" aria-label="السابق" data-icon="chevR"></button>
      <button class="nav next" id="dNext" type="button" aria-label="التالي" data-icon="chevL"></button>
      <span class="pos" id="dPos"></span>
    </div>
    <div class="dbody">
      <h2 id="dName"></h2>
      <div class="dprices" id="dPrices"></div>
      <dl class="rows" id="dRows"></dl>
    </div>
    <div class="dactions">
      <button class="btn primary" id="dShare" type="button"><span data-icon="share"></span><span>مشاركة الصورة</span></button>
      <button class="btn" id="dShareText" type="button">مشاركة نص</button>
    </div>
  </div>
</div>

<!-- تصدير PDF -->
<div id="pdfSheet" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="panel sheet">
    <div class="sheet-head"><h3>تصدير ملف PDF</h3><button class="x flat" data-close type="button" aria-label="إغلاق" data-icon="close"></button></div>

    <label class="field"><span>ماذا تريد أن تصدّر؟</span>
      <select id="pdfScope"></select>
    </label>
    <label class="field"><span>عدد المنتجات في الصفحة</span>
      <select id="pdfLayout">
        <option value="6">6 منتجات (أصغر حجماً)</option>
        <option value="4">4 منتجات</option>
        <option value="1">منتج واحد بالتفصيل</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="pdfStock"><span>المتوفر فقط (الباقي)</span></label>
    <label class="check" id="pdfCartonRow"><input type="checkbox" id="pdfCarton"><span>إظهار سعر الكارتون وعدد التعبئة</span></label>
    <p class="hint" id="pdfInfo"></p>

    <progress id="pdfProg" value="0" max="1" hidden></progress>
    <p class="hint" id="pdfText"></p>

    <div class="btnrow">
      <button class="btn primary" id="pdfStart" type="button">إنشاء الملف</button>
      <button class="btn" id="pdfCancel" type="button" hidden>إيقاف</button>
    </div>
    <div class="btnrow" id="pdfDone" hidden>
      <button class="btn primary" id="pdfShare" type="button"><span data-icon="share"></span><span>مشاركة الملف</span></button>
      <button class="btn" id="pdfSave" type="button">حفظ / فتح</button>
    </div>
  </div>
</div>

<!-- الإعدادات -->
<div id="settings" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="panel sheet">
    <div class="sheet-head"><h3>الإعدادات</h3><button class="x flat" data-close type="button" aria-label="إغلاق" data-icon="close"></button></div>

    <label class="row-switch">
      <span><b>وضع عرض الزبون</b><small>يُخفي سعر الكارتون والكمية والباركود من الشاشة والصور والـ PDF</small></span>
      <input type="checkbox" id="optCustomer">
    </label>

    <section>
      <h4>الأسعار والبيانات</h4>
      <p class="hint" id="dataInfo"></p>
      <button class="btn" id="btnRefresh" type="button">تحديث الأسعار الآن</button>
    </section>

    <section>
      <h4>العمل بدون إنترنت</h4>
      <p class="hint">الأسماء والأسعار تُحفظ تلقائياً. حمّل الصور مرة واحدة وأنت متصل بالإنترنت لتعمل كلها بدونه.</p>
      <div class="btnrow">
        <button class="btn" id="btnDlThumbs" type="button">تحميل كل الصور</button>
        <button class="btn" id="btnDlFull" type="button">تحميل الصور بالجودة العالية</button>
      </div>
      <progress id="dlProg" value="0" max="1" hidden></progress>
      <p class="hint" id="dlText"></p>
      <p class="hint" id="storageInfo"></p>
    </section>

    <section>
      <h4>تثبيت التطبيق</h4>
      <p class="hint">في Safari: زر المشاركة ← «إضافة إلى الشاشة الرئيسية». يفتح بعدها كتطبيق مستقل.</p>
    </section>
  </div>
</div>

<nav class="tabbar" id="tabbar">
  <button type="button" data-view="all" class="on"><span data-icon="grid"></span><span>كل المواد</span></button>
  <button type="button" data-view="companies"><span data-icon="building"></span><span>الشركات</span></button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
