name: تحديث بيانات الكتالوج
on:
  push:
    branches: [main]
    paths: ['excel/**','raw_images/**','tools/convert.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python tools/convert.py --prune
      - run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data images reports
          git diff --cached --quiet || (git commit -m "update data" && git push)

